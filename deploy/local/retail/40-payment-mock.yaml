# ONE replica on purpose: payment-mock keeps idempotency keys in memory,
# so two copies would not know about each other's payments.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-mock
  namespace: retail
  labels:
    app.kubernetes.io/name: payment-mock
    app.kubernetes.io/part-of: retail
spec:
  replicas: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: payment-mock
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: payment-mock
        app.kubernetes.io/part-of: retail
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: payment-mock
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: payment-mock
          image: payment-mock:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: PAYMENT_FAILURE_RATE
              value: "0"
            - name: PAYMENT_DECLINE_RATE
              value: "0"
            - name: PAYMENT_LATENCY_MS
              value: "0"
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: payment-mock
  namespace: retail
  labels:
    app.kubernetes.io/name: payment-mock
    app.kubernetes.io/part-of: retail
spec:
  selector:
    app.kubernetes.io/name: payment-mock
  ports:
    - name: http
      port: 80
      targetPort: http
