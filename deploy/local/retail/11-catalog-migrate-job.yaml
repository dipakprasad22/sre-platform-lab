# Applies catalog schema changes to an existing database.
# Every SQL file must be safe to run more than once (CREATE ... IF NOT EXISTS).
# A Job cannot be changed after it is created: to run it again,
#   kubectl delete job -n retail catalog-migrate   and apply again.
apiVersion: batch/v1
kind: Job
metadata:
  name: catalog-migrate
  namespace: retail
  labels:
    app.kubernetes.io/name: catalog-migrate
    app.kubernetes.io/part-of: retail
spec:
  backoffLimit: 6               # retry if the database is not ready yet
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 3600 # clean up the finished Job after 1 hour
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog-migrate
        app.kubernetes.io/part-of: retail
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: postgres:17
          command:
            - sh
            - -c
            - |
              set -e
              for f in /migrations/*.sql; do
                echo "applying $f"
                psql -v ON_ERROR_STOP=1 -h postgres -U catalog -d catalog_db -f "$f"
              done
              echo "all migrations applied"
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: catalog-db
                  key: password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: catalog-migrations
