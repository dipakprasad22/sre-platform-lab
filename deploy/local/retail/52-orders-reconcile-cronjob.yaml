# Every 2 minutes, fix orders stuck in PENDING for more than 60 seconds.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: orders-reconcile
  namespace: retail
  labels:
    app.kubernetes.io/name: orders-reconcile
    app.kubernetes.io/part-of: retail
spec:
  schedule: "*/2 * * * *"
  concurrencyPolicy: Forbid       # never run two at the same time
  startingDeadlineSeconds: 60     # skip a run if it could not start within 60s
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 100  # must finish before the next run starts
      template:
        metadata:
          labels:
            app.kubernetes.io/name: orders-reconcile
            app.kubernetes.io/part-of: retail
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: reconcile
              image: curlimages/curl:8.11.1
              args:
                - --fail-with-body
                - --silent
                - --show-error
                - --max-time
                - "90"
                - -X
                - POST
                - http://orders/internal/orders/reconcile?older_than_seconds=60
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
