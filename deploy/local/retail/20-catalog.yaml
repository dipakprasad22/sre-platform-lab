apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: retail
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: retail
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0     # never remove an old pod before a new one is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: catalog
        app.kubernetes.io/part-of: retail
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      # Spread the 2 pods across different nodes, so one node failure does not take both.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: catalog
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: catalog
          image: catalog:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: CATALOG_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: catalog-db
                  key: database-url
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5   # let the load balancer stop sending traffic before we shut down
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
  namespace: retail
  labels:
    app.kubernetes.io/name: catalog
    app.kubernetes.io/part-of: retail
spec:
  selector:
    app.kubernetes.io/name: catalog
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: catalog
  namespace: retail
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: catalog