name: retail

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in .env}
      POSTGRES_DB: catalog_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./catalog/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_db"]
      interval: 5s
      timeout: 3s
      retries: 10
  catalog:
    build: ./catalog
    image: catalog:dev
    environment:
      CATALOG_DATABASE_URL: postgresql://catalog:${CATALOG_DB_PASSWORD}@postgres:5432/catalog_db
    ports:
      - "8001:8000"
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  pgdata: