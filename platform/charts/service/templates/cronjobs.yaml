{{- range .Values.cronJobs }}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    app.kubernetes.io/name: {{ .name }}
    app.kubernetes.io/part-of: {{ $.Values.partOf }}
    app.kubernetes.io/managed-by: {{ $.Release.Service }}
spec:
  schedule: {{ .schedule | quote }}
  concurrencyPolicy: Forbid       # never run two at the same time
  startingDeadlineSeconds: 60     # skip a missed run instead of running a burst later
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .activeDeadlineSeconds | default 100 }}
      template:
        metadata:
          labels:
            app.kubernetes.io/name: {{ .name }}
            app.kubernetes.io/part-of: {{ $.Values.partOf }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            {{- include "service.podSecurityContext" . | nindent 12 }}
          containers:
            - name: {{ .name }}
              image: {{ .image }}
              args:
                {{- toYaml .args | nindent 16 }}
              resources:
                requests:
                  cpu: 10m
                  memory: 16Mi
                limits:
                  memory: 32Mi
              securityContext:
                {{- include "service.containerSecurityContext" $ | nindent 16 }}
{{- end }}
